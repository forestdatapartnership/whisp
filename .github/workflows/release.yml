name: Create Release

# Releases the version currently in pyproject.toml, then bumps it for the next
# cycle (so main always sits one version ahead of the latest release).
on:
  workflow_dispatch:
    inputs:
      next-version:
        description: "Version set on main AFTER the release: a bump rule (prerelease, patch, minor, major) or an explicit version (e.g. 3.1.0b1)"
        required: false
        default: "prerelease"
        type: string
      whats-new:
        description: "Optional notes placed above the auto-generated changelog"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install poetry twine

      - name: Resolve version
        id: vars
        run: |
          VER=$(poetry version -s)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "tag=v$VER" >> $GITHUB_OUTPUT

      - name: Fail if the tag already exists
        run: |
          git fetch --tags
          if git rev-parse "refs/tags/${{ steps.vars.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.vars.outputs.tag }} already exists - bump pyproject.toml first" >&2
            exit 1
          fi

      - name: Validate next-version
        # Checked up front so a typo fails before anything reaches PyPI; the bump
        # itself only runs at the end, once the release has succeeded.
        env:
          NEXT: ${{ github.event.inputs.next-version || 'prerelease' }}
        run: poetry version --dry-run "$NEXT"

      - name: Build wheel and sdist
        run: poetry build

      - name: Publish to PyPI
        # PYPI_API_TOKEN is a PyPI API token (repo secret) scoped to openforis-whisp.
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: poetry publish --username __token__ --password "$PYPI_TOKEN"

      - name: Tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.vars.outputs.tag }}" -m "Release ${{ steps.vars.outputs.tag }}"
          git push origin "${{ steps.vars.outputs.tag }}"

      - name: Compose release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHATS_NEW: ${{ github.event.inputs.whats-new }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body > GENERATED.md
          # "Changes to results" and "Breaking changes" lines from the PR descriptions
          # (see .github/pull_request_template.md); empty if no PR has any
          # Runs after PyPI and the tag, so a failure here must not stop the release
          python .github/scripts/release_sections.py "$GITHUB_REPOSITORY" GENERATED.md > SECTIONS.md \
            || { echo "::warning::Could not collect sections from the PRs; release notes without them"; : > SECTIONS.md; }

          # The text shared by the release notes and the CHANGELOG.md entry
          : > TOP.md
          if [ -n "$WHATS_NEW" ]; then printf '%s\n\n' "$WHATS_NEW" >> TOP.md; fi
          if [ -s SECTIONS.md ]; then cat SECTIONS.md >> TOP.md; printf '\n' >> TOP.md; fi

          cp TOP.md RELEASE_NOTES.md
          # House style from earlier hand-written releases: "- title in #N" (no author, it is
          # one person's repo), category headings in bold under "What's Changed", each
          # preceded by a blank line so markdown does not fold the heading into the list above
          sed -E -e 's, by @[A-Za-z0-9-]+ in https://github.com/[^ ]+/pull/([0-9]+), in #\1,' \
                 -e 's,^\* ,- ,' \
                 -e 's,^### (.+)$,\n**\1:**,' GENERATED.md >> RELEASE_NOTES.md
          printf '\n**PyPi Release**: [openforis-whisp](https://pypi.org/project/openforis-whisp/%s/)\n' \
            "$VERSION" >> RELEASE_NOTES.md

          # CHANGELOG.md entry: version and date, the same top text, and the PRs it contains
          PRS=$(grep -oE 'pull/[0-9]+' GENERATED.md | sed 's,pull/,#,' | awk '!seen[$0]++' | paste -sd, - | sed 's/,/, /g')
          {
            printf '## %s (%s)\n\n' "$TAG" "$(date -u +%F)"
            cat TOP.md
            if [ -n "$PRS" ]; then printf 'Pull requests: %s\n' "$PRS"; fi
          } > CHANGELOG_ENTRY.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.vars.outputs.tag }}" \
            --title "${{ steps.vars.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md

      - name: Bump version for the next cycle
        env:
          NEXT: ${{ github.event.inputs.next-version || 'prerelease' }}
        run: |
          # Newest release first, just below the marker line in CHANGELOG.md
          awk 'FNR==NR { entry = entry $0 "\n"; next }
               { print }
               /^<!-- releases below -->$/ { printf "\n%s", entry }' \
            CHANGELOG_ENTRY.md CHANGELOG.md > CHANGELOG.new && mv CHANGELOG.new CHANGELOG.md
          rm -f RELEASE_NOTES.md GENERATED.md SECTIONS.md TOP.md CHANGELOG_ENTRY.md
          poetry version "$NEXT"
          NEW=$(poetry version -s)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "Bump version to $NEW; add ${{ steps.vars.outputs.tag }} to CHANGELOG.md [skip ci]"
          git push origin HEAD:main
